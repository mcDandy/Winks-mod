plugins {
    id 'net.neoforged.moddev'
}

group = 'cz.mcdandy.winksmod'
version = project.findProperty('mod_version') ?: '2.0.0'
base.archivesName = 'winksmod'

repositories {
    mavenCentral()
}

// Minecraft 26.x ships as Java 25 bytecode (see version.json java_component/java_version).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.findProperty('neoforge_version')

    // Fail the build when an access transformer entry no longer resolves
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', 'winksmod', '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        winksmod {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

// The NeoForm Runtime tasks default their own launcher to a Java 21 toolchain, which this
// machine has no install of (and Minecraft 26.x would not run on anyway). Point them at the
// same Java 25 toolchain everything else uses.
def nfrtLauncher = project.extensions.getByType(JavaToolchainService)
        .launcherFor { spec -> spec.languageVersion.set(JavaLanguageVersion.of(25)) }

tasks.named('downloadAssets').configure { task ->
    task.javaExecutable.set(nfrtLauncher.map { launcher -> launcher.executablePath.asFile.absolutePath })
}
